<title>Stock Command</title>

<meta property="og:title" content="Stock Command" />

<link rel="manifest" href="/manifest.json" />
<script>
  (function() {
    try {
      var t = localStorage.getItem("stock-command-theme") || localStorage.getItem("stocky-theme");
      if (t === "light") {
        document.documentElement.setAttribute("data-theme", "light");
        document.documentElement.style.colorScheme = "light";
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.colorScheme = "dark";
      }
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
      document.documentElement.style.colorScheme = "dark";
    }
  })();
</script>

<style>
  :root,
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #111317;
    --bg-deep: #0D0F12;
    --panel: #1C1F24;
    --panel-card: #181A1F;
    --panel-alt: #20242B;
    --elevated: #282a2e;

    --border-subtle: #262A30;
    --border-grid: #2D323A;
    --border-variant: #44483c;
    
    --primary: #aed286;
    --primary-dim: #8bb362;
    --on-primary: #1d3700;
    --primary-container: #4a6829;
    --on-primary-container: #c2e698;
    
    --amber: #fa5d18;
    --amber-bg: rgba(250, 93, 24, 0.16);
    --amber-border: #fa5d18;
    --amber-ink: #ffb59b;
    --amber-solid: #E24C00;
    
    --red: #bb1c1c;

    --red-ink: #ffb4ab;
    --red-solid: #BB1C1C;
    
    --green-bg: rgba(74, 104, 41, 0.2);
    --green-border: #3C6A3E;
    --green-ink: #aed286;
    --ok-text: #aed286;
    
    --ink: #e2e2e8;
    --ink-primary: #E0D4C2;
    --ink-muted: #9A9086;
    --ink-variant: #c4c8b9;
    --ink-faint: #6B6867;

    /* Canonical semantic tokens */
    --bg-input: #14161A;
    --panel-dark: #232730;
    --border-cell: #2B2F36;
    --text-muted-slate: #CBD5E1;
    --badge-ok-bg: #17221A;
    --badge-ok-border: #2B3D2B;

    --font-sans: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    
    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-pin: 6px 0 10px -4px rgba(0, 0, 0, 0.65);
    
    /* Design token scales */
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-pill: 999px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;

    /* Component specific semantic tokens */

    --status-ok-accent: var(--primary);

    --badge-low-bg: rgba(245, 158, 11, 0.18);
    --badge-low-border: rgba(245, 158, 11, 0.35);
    --badge-low-ink: #fcd34d;

    --badge-out-bg: rgba(239, 68, 68, 0.18);
    --badge-out-border: rgba(239, 68, 68, 0.35);
    --badge-out-ink: #fca5a5;

    /* Multi-Segment Progress Bars */
    --progress-track-bg: rgba(18, 21, 26, 0.72);

    /* Quick Check Grid Cells */

    --cell-low-glow: 0 0 8px rgba(217, 119, 6, 0.4), inset 0 0 3px rgba(217, 119, 6, 0.2);
    --cell-low-ink: #fbbf24;

    --cell-out-border: #ef4444;
    --cell-out-bg: rgba(187, 28, 28, 0.22);
    --cell-out-glow: 0 0 8px rgba(239, 68, 68, 0.45), inset 0 0 3px rgba(239, 68, 68, 0.2);
    --cell-out-ink: #f87171;
    --cell-out-text-shadow: none;

    /* Navigation Active Tab Color */

    /* Note Editor Tokens */
    --note-item-bg: rgba(0, 0, 0, 0.14);
    --note-btn-bg: rgba(0, 0, 0, 0.18);
    --note-input-box-bg: rgba(0, 0, 0, 0.14);

    color-scheme: light;
    --bg: #F2F3F5;
    --bg-deep: #E6E8EC;
    --panel: #FFFFFF;
    --panel-card: #FFFFFF;

    --elevated-high: #F2F3F5;

    --border-subtle: #D1D5DB;
    --border-grid: #D1D5DB;

    --primary-dim: #235632;
    --on-primary: #FFFFFF;
    --primary-container: #E1F2E6;
    --on-primary-container: #0D3717;

    --amber: #A64D00;
    --amber-bg: #FEF3E8;
    --amber-border: #F6C8A1;
    --amber-ink: #8A3B00;
    --amber-solid: #C45500;

    --red: #C5221F;
    --red-bg: #FDF0F0;
    --red-border: #F8B4B4;
    --red-ink: #9E1A17;
    --red-solid: #C5221F;

    --green-bg: #E1F2E6;
    --green-border: #A3D9B1;
    --green-ink: #1C522D;
    --ok-text: #1C522D;
    --counted-bg: #E1F2E6;
    --counted-text: #2C6B3F;

    --ink: #181A1E;
    --ink-primary: #181A1E;
    --ink-secondary: #4A515E;
    --ink-muted: #666D78;
    --ink-variant: #4A515E;
    --ink-faint: #858D9A;

    /* Canonical semantic tokens */
    --bg-input: #FFFFFF;
    --panel-dark: #E6E8EC;
    --border-cell: #D1D5DB;
    --text-muted-slate: #666D78;

    --shadow-card: 0 1px 3px rgba(24, 26, 30, 0.06), 0 4px 12px rgba(24, 26, 30, 0.04);

    /* Component specific semantic tokens */

    --nav-shadow: 0 8px 32px rgba(24, 26, 30, 0.12), 0 2px 8px rgba(24, 26, 30, 0.06);
    --primary-pill-bg: rgba(44, 107, 63, 0.10);
    --primary-pill-border: rgba(44, 107, 63, 0.25);
    --corner-fold: rgba(0, 0, 0, 0.10);
    --nav-tab-inactive: #666D78;

    /* Status Card & Glow Tokens */

    --status-card-title-ink: var(--ink);

    --status-out-bg: linear-gradient(135deg, #FDF0F0 0%, #FFFFFF 48%, #F7F8FA 100%);
    --status-out-border: 1.5px solid rgba(220, 38, 38, 0.40);
    --status-out-shadow: 0 8px 24px -2px rgba(24, 26, 30, 0.12), 0 2px 8px rgba(220, 38, 38, 0.22), inset 0 1px 0 #FFFFFF;

    /* Shop Status Badges */
    --badge-clear-bg: var(--green-bg);
    --badge-clear-border: var(--green-border);

    --badge-low-bg: var(--amber-bg);
    --badge-low-border: var(--amber-border);

    --badge-out-bg: var(--red-bg);
    --badge-out-border: var(--red-border);

    --progress-ok-shadow: 0 0 8px rgba(44, 107, 63, 0.40);

    --progress-low-bg: linear-gradient(90deg, #8A3B00 0%, #C45500 100%);

    --stat-low-ink: var(--amber-ink);

    --stat-ok-dot-shadow: 0 0 5px rgba(44, 107, 63, 0.5);
    --stat-low-dot-shadow: 0 0 5px rgba(217, 119, 6, 0.5);
    --stat-out-dot-shadow: 0 0 5px rgba(194, 48, 45, 0.5);

    /* Recent Activity Card & Icons */
    --rec-card-bg: #E6E8EC;
    --rec-card-border: 1px solid #CBD1D8;
    --rec-card-shadow: 0 4px 16px rgba(24, 26, 30, 0.08);

    --recent-quick-bg: #FFE7D1;
    --recent-quick-border: 1.5px solid #FDBA74;
    --recent-quick-color: #9A3412;

    --recent-count-bg: #D1FAE5;
    --recent-count-border: 1.5px solid #6EE7B7;
    --recent-count-color: #065F46;

    /* Theme Footer Button */
    --theme-footer-bg: #E6E8EC;
    --theme-footer-border: 1px solid #CBD1D8;

    /* Quick Check Grid Cells */
    --cell-low-border: #D97706;
    --cell-low-bg: linear-gradient(135deg, #FDE68A 0%, #F59E0B 100%);
    --cell-low-glow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 2px 4px rgba(217, 119, 6, 0.25);
    --cell-low-ink: #78350F;

    --cell-out-border: #DC2626;
    --cell-out-bg: linear-gradient(135deg, #FECACA 0%, #EF4444 100%);
    --cell-out-glow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 2px 4px rgba(220, 38, 38, 0.25);
    --cell-out-ink: #FFFFFF;
    --cell-out-text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);

    /* Navigation Active Tab Color */
    --nav-tab-active: #155228;

    /* Note Editor Tokens */
    --note-item-bg: rgba(0, 0, 0, 0.04);
    --note-btn-bg: rgba(0, 0, 0, 0.05);

    --note-switch-off-bg: rgba(0, 0, 0, 0.12);

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }

  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100%;
    min-height: 100vh;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    overflow-y: visible;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }

  /* Pull-to-refresh indicator */
  .ptr-indicator {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    pointer-events: none;
    transform: translateY(-60px);
    transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    opacity: 0;
  }
  .ptr-indicator.is-pulling {
    transition: none;
    opacity: 1;
  }
  .ptr-indicator.is-refreshing {
    transform: translateY(14px) !important;
    opacity: 1 !important;
    transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .ptr-content {
    background: rgba(24, 28, 36, 0.94);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(174, 210, 134, 0.35);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 2px 6px rgba(0, 0, 0, 0.4);
    border-radius: 999px;
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--primary);
  }
  .ptr-spinner {
    width: 14px;
    height: 14px;
    stroke: var(--primary);
    flex-shrink: 0;
    transform-origin: center;
    transition: transform 0.1s linear;
  }
  .ptr-indicator.is-refreshing .ptr-spinner {
    animation: ptrSpin 0.75s linear infinite !important;
  }
  @keyframes ptrSpin {
    100% { transform: rotate(360deg); }
  }
  .auth-input {
    width: 100%;
    box-sizing: border-box;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 11px 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .auth-input:focus {
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 2px rgba(174, 210, 134, 0.22) !important;
    background: var(--elevated) !important;
  }
  .auth-input::placeholder {
    color: var(--ink-faint);
    opacity: 0.8;
  }
  .auth-btn {
    transition: transform 0.1s ease, filter 0.15s ease, opacity 0.15s ease;
  }
  .auth-btn:hover:not(:disabled) {
    filter: brightness(1.08);
  }
  .auth-btn:active:not(:disabled) {
    transform: translateY(1px);
  }
  .auth-btn:disabled {
    opacity: 0.7;
    cursor: wait !important;
  }
  .ptr-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    white-space: nowrap;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    color: inherit;
    border: none;
    background: none;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  input, textarea, select {
    font-family: inherit;
    color: inherit;
    background: transparent;
    border: none;
    outline: none;
  }

  /* Remove browser default up/down spinner buttons on number inputs */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none !important;
    margin: 0 !important;
    display: none !important;
  }
  input[type=number] {
    -moz-appearance: textfield !important;
    appearance: textfield !important;
  }

  /* Seamless Smooth Scrolling & Vertical Scrollbar Elimination */
  html, body, #app-root {
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar,
  #app-root::-webkit-scrollbar {
    width: 0px !important;
    height: 0px !important;
    display: none !important;
  }

  /* Universal vertical scrollbar removal for WebKit / Blink */
  ::-webkit-scrollbar {
    width: 0px !important;
    height: 5px;
  }
  ::-webkit-scrollbar:vertical {
    display: none !important;
    width: 0px !important;
  }
  ::-webkit-scrollbar-button {
    display: none !important;
    width: 0px !important;
    height: 0px !important;
  }
  ::-webkit-scrollbar-corner {
    background: transparent !important;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg-deep);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 999px;
  }
  @media (hover: hover) and (pointer: fine) {
    ::-webkit-scrollbar-thumb:hover {
      background: var(--ink-muted);
    }
  }

  /* Matrix Table Horizontal Scrollbar (Dark mode default) */
  .matrix-table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.22) #14171C;
  }
  .matrix-table-scroll::-webkit-scrollbar {
    height: 5px !important;
    width: 0px !important;
    display: block !important;
  }
  .matrix-table-scroll::-webkit-scrollbar-button {
    display: none !important;
    width: 0px !important;
    height: 0px !important;
  }
  .matrix-table-scroll::-webkit-scrollbar-corner {
    background: transparent !important;
  }
  .matrix-table-scroll::-webkit-scrollbar-track {
    background: #14171C !important;
    border-radius: 0 0 8px 8px !important;
  }
  .matrix-table-scroll::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.22) !important;
    border-radius: 999px !important;
  }
  @media (hover: hover) and (pointer: fine) {
    .matrix-table-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.38) !important;
    }
  }

  /* Hide vertical scrollbars across internal containers in Firefox */
  .count-chips-scroll,
  textarea {
    scrollbar-width: none;
  }
  .style-tabs-scroll {
    scrollbar-width: thin;
  }

  /* Notes Column Grid & Cards */
  .notes-grid-columns {
    display: flex;
    gap: 12px;
    width: 100%;
    align-items: flex-start;
  }
  .notes-column {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .note-card {
    display: block;
    width: 100%;
    box-sizing: border-box;
    will-change: transform;
    touch-action: pan-y;
  }
  .note-card:active {
    filter: brightness(1.08);
  }
  .note-card.is-dragging-card {
    opacity: 0.22 !important;
    filter: grayscale(0.5) brightness(0.85);
  }
  .note-card-track-btn:active,
  .note-item-track-btn:active {
    transform: scale(0.9);
  }
  #note-editor-panel {
    will-change: transform, opacity;
  }
  .notes-dropdown {
    animation: fadeInDropdown 0.14s ease-out;
  }
  @keyframes fadeInDropdown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .notes-toolbar-icon-btn:hover,
  .notes-toolbar-icon-btn.is-pressed {
    background: rgba(255, 255, 255, 0.06) !important;
  }
  .notes-dropdown-item {
    transition: background 0.12s ease;
  }
  .notes-dropdown-item:hover,
  .notes-dropdown-item.is-pressed {
    background: rgba(255, 255, 255, 0.06);
  }

  #app-root {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); /* Clearance for floating bottom navigation capsule */
  }

  /* Pinned bottom nav container - pure fixed positioning without transform to eliminate mobile scroll jumping */
  .bottom-nav-fixed-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 50;
    display: flex;
    justify-content: center;
    pointer-events: none;
    padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px));
    -webkit-tap-highlight-color: transparent !important;
  }

  /* Bottom navigation touch feedback - eliminate Android blue tap-highlight and sticky outlines */
  .bottom-nav-fixed-wrap nav,
  .bottom-nav-fixed-wrap button,
  .bottom-nav-fixed-wrap a,
  .bottom-nav-fixed-wrap .nav-icon,
  .bottom-nav-fixed-wrap .nav-label,
  .nav-tab-btn {
    -webkit-tap-highlight-color: transparent !important;
    -webkit-touch-callout: none !important;
    outline: none !important;
    user-select: none;
  }
  .bottom-nav-fixed-wrap button:focus,
  .bottom-nav-fixed-wrap button:focus-visible,
  .bottom-nav-fixed-wrap button:active,
  .nav-tab-btn:focus,
  .nav-tab-btn:focus-visible,
  .nav-tab-btn:active {
    outline: none !important;
    box-shadow: none !important;
    -webkit-tap-highlight-color: transparent !important;
  }

  /* History / Audit Log Header Layout (One line on wide screens, two lines on mobile) */
  .history-card-header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    user-select: none;
  }
  .history-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    line-height: 1;
  }
  .history-header-left {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }
  .history-shop-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.2;
  }
  .history-badges-desktop {
    display: none;
  }
  .history-badges-mobile {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding-top: 4px;
  }
  @media (min-width: 500px) {
    .history-badges-desktop {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .history-badges-mobile {
      display: none !important;
    }
  }

  .btn-reset {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }

  /* Glass dropdown & Popovers styling (True Frosted Glassmorphism) */
  @keyframes glassDropdownIn {
    0% { opacity: 0; transform: translateY(-5px) scale(0.97); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Check Page Dropdown: Sleek modern dark frosted glass with balanced opacity */
  .glass-dropdown-check {
    background: linear-gradient(180deg, rgba(24, 29, 38, 0.94) 0%, rgba(16, 20, 27, 0.96) 100%) !important;
    backdrop-filter: blur(20px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75), 0 4px 12px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.20) !important;
    animation: glassDropdownIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: top center;
  }

  /* Count Page Dropdown: Precision industrial dark box matching the #242830 aesthetic with high contrast & crisp borders */
  .glass-dropdown-count {
    background: linear-gradient(180deg, rgba(32, 36, 44, 0.96) 0%, rgba(22, 26, 32, 0.98) 100%) !important;
    backdrop-filter: blur(16px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(16px) saturate(160%) !important;
    border: 1px solid var(--border) !important;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8), 0 4px 12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
    animation: glassDropdownIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: top center;
  }

  /* Generic Glass Popover (Kebab menus, Style tools) */
  .glass-dropdown {
    background: linear-gradient(180deg, rgba(26, 31, 40, 0.94) 0%, rgba(17, 21, 28, 0.96) 100%) !important;
    backdrop-filter: blur(20px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75), 0 4px 12px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.20) !important;
    animation: glassDropdownIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: top center;
  }

  .glass-item {
    transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .glass-item:hover,
  .glass-item.is-pressed {
    background: rgba(255, 255, 255, 0.10) !important;
    color: #FFFFFF !important;
  }
  .glass-item:active {
    background: rgba(255, 255, 255, 0.18) !important;
    color: #FFFFFF !important;
    transform: scale(0.99);
  }

  /* Page view fade animation - only triggered on true page navigation */
  @keyframes pageFadeIn {
    0% { opacity: 0.35; transform: translateY(4px); }
    100% { opacity: 1; transform: none; }
  }
  .page-enter-anim {
    animation: pageFadeIn 0.20s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Modal entry and exit animations */
  @keyframes overlayIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes overlayOut {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
  .modal-overlay-anim {
    animation: overlayIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .modal-fade-out {
    animation: overlayOut 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    pointer-events: none !important;
  }
  @keyframes modalIn {
    0% { opacity: 0; transform: scale(0.94) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-anim {
    animation: modalIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Ultra-smooth CSS Grid Collapsible Accordions (Handles both expanding & collapsing) */
  .collapsible-grid {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }
  .collapsible-grid.is-open {
    grid-template-rows: 1fr;
    opacity: 1;
  }
  .collapsible-inner {
    min-height: 0;
    overflow: hidden;
  }

  /* Chevron / arrow toggle icon with buttery smooth 180-deg rotation */
  .toggle-rot-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toggle-rot-icon.is-open {
    transform: rotate(180deg);
  }

  /* Tactile feedback for tap buttons */
  .tap-btn {
    transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.12s ease;
  }
  .tap-btn:active {
    transform: scale(0.97);
  }

  /* Shop Picker trigger button with subtle gentle scale & brightness on hover (no border glow) */
  .shop-picker-btn {
    transition: transform 0.20s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.18s ease, filter 0.18s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .shop-picker-btn:hover,
  .shop-picker-btn.is-pressed {
    filter: brightness(1.08);
  }
  .shop-picker-btn:active {
    transform: scale(0.985) !important;
    filter: brightness(1.08);
  }

  /* Check Page Shop Kebab Edit Button matching shop picker background & no border glow */
  .check-shop-kebab-btn {
    transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.18s ease, filter 0.18s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .check-shop-kebab-btn:hover,
  .check-shop-kebab-btn.is-pressed {
    filter: brightness(1.08);
    color: #cbd5e1 !important;
    background: var(--panel) !important;
  }
  .check-shop-kebab-btn:active {
    transform: scale(0.93) !important;
    filter: brightness(1.08);
    color: #cbd5e1 !important;
    background: var(--panel) !important;
  }

  /* Tool & Count Shop Kebab Icon Buttons - 44x44px touch targets, borderless, lighten icon only in toned-down whiteness (#cbd5e1) */
  .count-shop-kebab-btn, .tool-icon-btn {
    transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.18s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .count-tool-btn {
    min-width: 28px !important;
    min-height: 28px !important;
    width: 28px !important;
    height: 28px !important;
  }
  .count-shop-kebab-btn:hover,
  .count-shop-kebab-btn.is-pressed,
  .tool-icon-btn:hover,
  .tool-icon-btn.is-pressed {
    color: #cbd5e1 !important;
    background: transparent !important;
    border-color: transparent !important;
    box-shadow: none !important;
  }
  .count-shop-kebab-btn:active, .tool-icon-btn:active {
    transform: scale(0.93) !important;
    color: #cbd5e1 !important;
    background: transparent !important;
    border-color: transparent !important;
    box-shadow: none !important;
  }

  /* Color Browser Palette Toggle (Pure icon focus, refined gentle glow) */
  .count-palette-toggle-btn {
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    outline: none !important;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .count-palette-icon {
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease, color 0.18s ease;
    transform-origin: center center;
    color: var(--primary);
  }
  .count-palette-toggle-btn:hover .count-palette-icon {
    transform: scale(1.10);
    filter: drop-shadow(0 0 3px rgba(174, 210, 134, 0.35)) brightness(1.08);
    color: var(--primary) !important;
  }
  [data-theme="light"] .count-palette-toggle-btn:hover .count-palette-icon {
    filter: drop-shadow(0 0 3px rgba(44, 107, 63, 0.20)) brightness(1.04);
  }
  .count-palette-toggle-btn.is-open .count-palette-icon {
    filter: drop-shadow(0 0 2.5px rgba(174, 210, 134, 0.28));
    transform: scale(1.05);
  }
  [data-theme="light"] .count-palette-toggle-btn.is-open .count-palette-icon {
    filter: drop-shadow(0 0 2.5px rgba(44, 107, 63, 0.18));
  }
  .count-palette-toggle-btn:active .count-palette-icon {
    transform: scale(0.88) !important;
    filter: brightness(1.03);
  }

  .count-browser-item {
    transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .count-browser-item:hover {
    filter: brightness(1.10);
    border-color: var(--primary-dim) !important;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22);
  }
  .count-browser-item:active {
    transform: scale(0.96) translateY(0) !important;
    filter: brightness(1.04);
  }
  [data-theme="light"] .count-browser-item:hover {
    box-shadow: 0 2px 6px rgba(24, 26, 30, 0.08);
  }

  .count-browser-done-btn {
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease, transform 0.12s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .count-browser-done-btn:hover {
    background: var(--primary) !important;
    color: var(--on-primary) !important;
    border-color: var(--primary) !important;
    transform: none !important;
    box-shadow: 0 3px 10px rgba(174, 210, 134, 0.35);
  }
  [data-theme="light"] .count-browser-done-btn:hover {
    box-shadow: 0 3px 10px rgba(44, 107, 63, 0.30);
  }
  .count-browser-done-btn:active {
    transform: scale(0.95) !important;
  }

  /* Segmented Mode Sliding Pill Indicator & Mode Buttons */
  .count-mode-slider {
    transition: transform 0.26s cubic-bezier(0.34, 1.4, 0.64, 1), background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    will-change: transform;
  }
  .count-mode-tab-btn {
    transition: color 0.16s ease, background-color 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, transform 0.12s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Active +INCLUDE hover matches DONE button hover effects */
  .count-mode-tab-btn.is-active.count-mode-btn-inc:hover {
    background: var(--primary) !important;
    color: var(--on-primary) !important;
    border-color: var(--primary) !important;
    transform: none !important;
    box-shadow: 0 3px 10px rgba(174, 210, 134, 0.35) !important;
  }
  [data-theme="light"] .count-mode-tab-btn.is-active.count-mode-btn-inc:hover {
    box-shadow: 0 3px 10px rgba(44, 107, 63, 0.30) !important;
  }
  /* Active -EXCLUDE hover matches DONE button hover effects (amber theme with dark contrast text) */
  .count-mode-tab-btn.is-active.count-mode-btn-ex:hover {
    background: #FA5D18 !important;
    color: #200800 !important;
    border-color: #FA5D18 !important;
    transform: none !important;
    box-shadow: 0 3px 10px rgba(250, 93, 24, 0.40) !important;
  }
  [data-theme="light"] .count-mode-tab-btn.is-active.count-mode-btn-ex:hover {
    background: #C45500 !important;
    color: #FFFFFF !important;
    border-color: #C45500 !important;
    box-shadow: 0 3px 10px rgba(196, 85, 0, 0.35) !important;
  }
  .count-mode-tab-btn:active {
    transform: scale(0.95) !important;
  }
  /* Unselected mode retains subtle text brighten */
  .count-mode-tab-btn:not(.is-active):hover {
    color: var(--ink) !important;
  }

  /* EDIT MATRIX Interactive Buttons (Palette, Reorder Arrows, Delete X, Swatch, Names) */
  .matrix-icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    min-width: 22px;
    min-height: 22px;
    border-radius: 4px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
    cursor: pointer;
    line-height: 1;
    font-family: var(--font-mono);
    box-sizing: border-box;
    padding: 0;
  }
  .matrix-icon-btn svg {
    pointer-events: none;
  }

  /* Palette Logo Button */
  .matrix-palette-btn {
    background: rgba(174, 210, 134, 0.08);
    border: 1px solid rgba(174, 210, 134, 0.22);
    color: var(--primary);
  }
  .matrix-palette-btn svg {
    width: 13px;
    height: 13px;
    display: block;
  }
  .matrix-palette-btn:hover {
    background: rgba(174, 210, 134, 0.22);
    border-color: rgba(174, 210, 134, 0.55);
    color: #d6f2af;
    transform: scale(1.12);
    box-shadow: 0 0 8px rgba(174, 210, 134, 0.30);
  }
  .matrix-palette-btn:active {
    background: rgba(174, 210, 134, 0.38);
    border-color: var(--primary);
    color: #ffffff;
    transform: scale(0.88) !important;
    box-shadow: 0 0 10px rgba(174, 210, 134, 0.45);
  }

  /* Reorder Arrows (◀ ▶ ▲ ▼) */
  .matrix-reorder-btn {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.10);
    color: var(--ink-muted);
    font-size: 10px;
    font-weight: 700;
  }
  .matrix-reorder-btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.30);
    color: #ffffff;
    transform: scale(1.12);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  .matrix-reorder-btn:active:not(:disabled) {
    background: rgba(255, 255, 255, 0.24);
    border-color: rgba(255, 255, 255, 0.45);
    color: #ffffff;
    transform: scale(0.88) !important;
  }
  .matrix-reorder-btn:disabled,
  .matrix-reorder-btn[disabled] {
    opacity: 0.18;
    cursor: not-allowed;
    pointer-events: none;
    background: transparent;
    border-color: transparent;
  }

  /* Delete "x" Buttons (✕) */
  .matrix-delete-btn {
    background: rgba(248, 113, 113, 0.08);
    border: 1px solid rgba(248, 113, 113, 0.22);
    color: #ffb4ab;
    font-size: 11px;
    font-weight: 800;
  }
  .matrix-delete-btn:hover {
    background: rgba(248, 113, 113, 0.24);
    border-color: rgba(248, 113, 113, 0.55);
    color: #ffb4ab;
    transform: scale(1.12);
    box-shadow: 0 0 8px rgba(248, 113, 113, 0.30);
  }
  .matrix-delete-btn:active {
    background: rgba(248, 113, 113, 0.42);
    border-color: #f87171;
    color: #ffffff;
    transform: scale(0.88) !important;
    box-shadow: 0 0 10px rgba(248, 113, 113, 0.45);
  }

  /* Color Swatch Edit Trigger Button */
  .matrix-swatch-btn {
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .matrix-swatch-btn:hover {
    border-color: var(--primary) !important;
    background: rgba(174, 210, 134, 0.16) !important;
    transform: scale(1.10);
    box-shadow: 0 0 8px rgba(174, 210, 134, 0.25);
  }
  .matrix-swatch-btn:active {
    transform: scale(0.90) !important;
    background: rgba(174, 210, 134, 0.30) !important;
    border-color: var(--primary) !important;
  }

  /* Editable Size / Color Name Text Button */
  .matrix-name-btn {
    transition: color 0.14s ease, transform 0.12s ease;
    cursor: pointer;
    user-select: none;
  }
  .matrix-name-btn:hover {
    color: var(--primary) !important;
    transform: translateY(-1px);
  }
  .matrix-name-btn:active {
    transform: translateY(0px) scale(0.96) !important;
    color: var(--primary) !important;
  }

  /* Matrix Add Buttons (+ SIZE, + ADD COLOR) */
  .matrix-add-btn {
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease, box-shadow 0.14s ease;
    user-select: none;
    cursor: pointer;
  }
  .matrix-add-btn:hover {
    border-color: var(--primary) !important;
    background: rgba(174, 210, 134, 0.12) !important;
    color: #d6f2af !important;
    transform: scale(1.02);
    box-shadow: 0 0 8px rgba(174, 210, 134, 0.20);
  }
  .matrix-add-btn:active {
    transform: scale(0.97) !important;
    background: rgba(174, 210, 134, 0.22) !important;
